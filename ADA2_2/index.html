<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escena 3D con Dos Objetos y Control de Cámara</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: #eeeeee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #ui-instructions {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
      user-select: none;
    }
    kbd {
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #555;
      font-weight: bold;
    }
  </style>
  <!-- gl-matrix: funciones matriciales 4x4 y vectores -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
</head>
<body>

  <div id="canvas-container">
    <canvas id="glCanvas" width="960" height="540"></canvas>
    <div id="ui-instructions">
      <strong>Controles de Cámara:</strong><br>
      • <kbd>W</kbd> <kbd>S</kbd> : Avanzar / Retroceder<br>
      • <kbd>A</kbd> <kbd>D</kbd> : Izquierda / Derecha<br>
      • <kbd>Espacio</kbd> / <kbd>Shift</kbd> : Subir / Bajar<br>
      • <strong>Clic y arrastre</strong> : Orientar mirada
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
