<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escena 3D: Dos Objetos Texturizados</title>
  <style>
    body {
      margin: 0;
      background-color: #0b0d12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      color: #eeeeee;
      overflow: hidden;
    }
    #canvas-container {
      position: relative;
      box-shadow: 0 10px 45px rgba(0, 0, 0, 0.9);
      border-radius: 8px;
      overflow: hidden;
    }
    canvas {
      display: block;
      cursor: grab;
      background: #07080b;
    }
    canvas:active {
      cursor: grabbing;
    }
    #ui-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(13, 16, 23, 0.88);
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.6;
      border: 1px solid #252b3b;
      pointer-events: none;
    }
    kbd {
      background: #252d42;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
  </style>
  <!-- gl-matrix: funciones de matrices y vectores de las notas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>
</head>
<body>
  <div id="canvas-container">
    <canvas id="glCanvas" width="920" height="700"></canvas>
    <div id="ui-panel">
      <strong>ESCENA 3D (DOS OBJETOS CON TEXTURA)</strong><br>
      • <strong>Objeto 1 (Izq):</strong> Jarrón con `texture1.png`<br>
      • <strong>Objeto 2 (Der):</strong> Toroide con `texture2.png`<br>
      • <kbd>Arrastrar Ratón</kbd> : Orbitar cámara<br>
      • <kbd>Rueda Ratón</kbd> : Zoom
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
